
server {
    listen 80;

    server_name shoprupee.com www.shoprupee.com _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;

        add_header Content-Type text/plain;

        return 200 'ShopRupee OK';
    }

    location /nginx-health {
        access_log off;

        return 200 'healthy';
    }
}
